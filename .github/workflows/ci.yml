name: CI

# Проверки запускаются на pull request и на main после слияния. §58 требует,
# чтобы тесты нужного уровня шли вместе с изменением, а §76 — чтобы они
# действительно проходили. До появления этого файла PR не проверял никто, кроме
# автора: ruleset гарантировал форму изменений, но не их работоспособность.
on:
  pull_request:
  push:
    branches: [main]

# Правами workflow ничего не пишет: он только читает репозиторий (§66, §67 —
# принцип минимальных привилегий).
permissions:
  contents: read

# Новая ревизия той же ветки отменяет предыдущий прогон: незачем тратить минуты
# на проверку кода, который уже переписан.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Имя job'а — это и есть имя проверки, которое указывается в ruleset
    # (Require status checks to pass). Менять его стоит осознанно: переименование
    # сломает уже настроенное требование.
    name: Core tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    env:
      # Без этого Windows-консоль спотыкается о кириллицу в выводе pytest.
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установить uv
        # Точная версия, а не плавающий мажорный тег: начиная с v8 Astral не
        # публикует теги вида `v10` — существует только `v10.1.0`, и ссылка на
        # `@v10` валит workflow на этапе «Prepare all required actions».
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # Кэшируется только пакетный кэш uv.
          enable-cache: true
          #
          # cache-python здесь намеренно ВЫКЛЮЧЕН, хотя кэшировал бы скачанный
          # интерпретатор. Внутри каталога managed-интерпретатора uv держит ссылку
          # `cpython-3.13-windows-x86_64-none`; при восстановлении кэша на Windows
          # эта ссылка не удаляется (её цель в кэш не попала), и следующий шаг
          # падает:
          #
          #   error: Failed to create Python minor version link directory
          #     cause: failed to remove directory ... The directory name is invalid.
          #     (os error 267)
          #
          # Проверено на практике: с cache-python джоба Core tests падала на этом
          # шаге. Экономия скачивания Python не стоит неработающего pipeline.
          cache-python: false

      - name: Установить Python
        run: uv python install 3.13

      - name: Установить зависимости
        # --locked: если uv.lock разошёлся с pyproject.toml, это ошибка, а не
        # повод молча пересобрать окружение и проверить не то, что зафиксировано.
        run: uv sync --all-groups --locked

      - name: Применить миграции
        # Core не применяет миграции сам (инвариант 11 §81), поэтому проверяем
        # отдельно, что схема собирается с нуля — зелёные тесты этого не
        # гарантируют, они применяют миграции своим путём.
        run: uv run alembic upgrade head

      - name: Тесты
        run: uv run pytest

  agent:
    # Windows-раннер обязателен: проекты Agent нацелены на net8.0-windows
    # (ADR-0011), потому что платформенная граница проверяется компилятором.
    # ADR-0006 по той же причине предписывает Windows-раннеры для всего проекта.
    name: Agent tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установить .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Собрать
        # Отдельный шаг, чтобы предупреждения компилятора были видны как
        # предупреждения, а не растворялись в выводе тестов.
        run: dotnet build Chronoscope.Agent.sln --nologo

      - name: Тесты
        run: dotnet test Chronoscope.Agent.sln --nologo --no-build
