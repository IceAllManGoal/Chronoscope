[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

# NOTE: keep this file pure ASCII.
#
# Alembic reads alembic.ini with encoding="locale", not UTF-8 (see
# alembic/util/compat.py). On Windows the locale encoding follows the system code
# page: with cp1252 (Western Europe) a non-ASCII byte raises UnicodeDecodeError
# and `alembic upgrade head` fails outright, while with cp1251 (Russia) the same
# byte decodes silently into garbage, so the defect stays invisible locally.
# PYTHONUTF8=1 does not help: locale.getencoding() deliberately ignores Python's
# UTF-8 mode. tests/test_migrations.py guards this.
#
# The database URL is deliberately not set here: it comes from the Chronoscope
# configuration (PROJECT_SPEC section 36), so migrations and the application
# cannot disagree about which database they mean. See migrations/env.py.

[post_write_hooks]
